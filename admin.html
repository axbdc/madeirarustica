<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Gestão · Madeira Rústica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#160d07; --panel:#23170f; --panel-2:#190f09; --field:#120a05;
    --line:rgba(201,165,123,0.16); --line-2:rgba(201,165,123,0.30);
    --text:#f3ece0; --muted:#b6a489; --faint:#8a7458;
    --accent:#c9a57b; --accent-2:#b07f4f; --accent-ink:#1b100a;
    --danger:#d98a6a; --ok:#9bbf8a;
    --radius:14px; --radius-sm:10px;
    --shadow:0 24px 60px rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif; font-size:15px; line-height:1.5;
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Playfair Display',serif; font-weight:600; margin:0;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  input,select,textarea{
    width:100%; font-family:inherit; font-size:14px; color:var(--text);
    background:var(--field); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:11px 13px; outline:none; transition:border-color .2s, box-shadow .2s;
  }
  input::placeholder,textarea::placeholder{color:var(--faint);}
  input:focus,select:focus,textarea:focus{border-color:var(--accent-2); box-shadow:0 0 0 3px rgba(201,165,123,0.12);}
  textarea{resize:vertical; min-height:84px;}
  label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:7px; letter-spacing:.01em;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:11px 20px; border-radius:var(--radius-sm); font-size:14px; font-weight:500;
    transition:transform .15s, background .2s, border-color .2s; border:1px solid transparent;
  }
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--accent); color:var(--accent-ink); font-weight:600;}
  .btn-primary:hover{background:#d8b88f;}
  .btn-ghost{border-color:var(--line-2); color:var(--text);}
  .btn-ghost:hover{background:rgba(201,165,123,0.08);}
  .btn-danger{border-color:rgba(217,138,106,0.4); color:var(--danger);}
  .btn-danger:hover{background:rgba(217,138,106,0.12);}
  .icon{width:18px; height:18px; flex:none;}

  /* ---------- LOGIN ---------- */
  #login{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .login-card{
    width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius); padding:40px 34px 34px; text-align:center; box-shadow:var(--shadow);
  }
  .login-card img{height:60px; margin-bottom:18px;}
  .login-card h1{font-size:1.5rem; margin-bottom:6px;}
  .login-card p{color:var(--muted); font-size:13.5px; margin:0 0 26px;}
  .login-card label{text-align:left;}
  .login-card .field{margin-bottom:16px;}
  .msg{font-size:13px; margin-top:14px; min-height:18px;}
  .msg.err{color:var(--danger);} .msg.ok{color:var(--ok);}

  /* ---------- APP ---------- */
  #app{display:none; max-width:980px; margin:0 auto; padding:0 20px 80px;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:22px 0; border-bottom:1px solid var(--line); margin-bottom:28px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand img{height:40px;}
  .brand .t{font-family:'Playfair Display',serif; font-size:1.15rem;}
  .brand .s{font-size:11.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.14em;}
  .head-row{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:22px; flex-wrap:wrap;}
  .head-row h2{font-size:1.4rem;}
  .count{color:var(--muted); font-size:13px; margin-left:8px;}

  /* project cards */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; display:flex; flex-direction:column;}
  .card .thumb{aspect-ratio:4/3; background:var(--panel-2); position:relative; overflow:hidden;}
  .card .thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .card .thumb .ph{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--faint);}
  .card .tag{position:absolute; top:10px; left:10px; background:rgba(22,13,7,0.82); color:var(--accent); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; padding:4px 10px; border-radius:999px;}
  .card .hidden-flag{position:absolute; top:10px; right:10px; background:rgba(22,13,7,0.82); color:var(--muted); font-size:11px; padding:4px 9px; border-radius:999px; display:flex; align-items:center; gap:4px;}
  .card .body{padding:13px 15px 15px; flex:1; display:flex; flex-direction:column;}
  .card .body h3{font-size:1.02rem; line-height:1.25; margin-bottom:3px;}
  .card .body .loc{color:var(--muted); font-size:12.5px; margin-bottom:12px;}
  .card .actions{margin-top:auto; display:flex; gap:8px;}
  .card .actions button{flex:1; padding:8px; border-radius:8px; font-size:13px; border:1px solid var(--line-2); display:flex; align-items:center; justify-content:center; gap:6px;}
  .card .actions .edit:hover{background:rgba(201,165,123,0.10);}
  .card .actions .del{color:var(--danger); border-color:rgba(217,138,106,0.35);}
  .card .actions .del:hover{background:rgba(217,138,106,0.12);}

  .empty{text-align:center; padding:60px 20px; color:var(--muted); border:1px dashed var(--line-2); border-radius:var(--radius);}
  .empty .icon{width:34px;height:34px;margin-bottom:12px;color:var(--faint);}

  /* loading */
  .loading{text-align:center; padding:50px; color:var(--muted);}

  /* ---------- MODAL ---------- */
  .overlay{position:fixed; inset:0; background:rgba(8,5,2,0.7); display:none; align-items:flex-start; justify-content:center; padding:30px 16px; overflow-y:auto; z-index:50;}
  .overlay.open{display:flex;}
  .modal{width:100%; max-width:560px; background:var(--panel); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); margin:auto;}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:20px 24px; border-bottom:1px solid var(--line);}
  .modal-head h2{font-size:1.3rem; display:flex; align-items:center; gap:10px;}
  .modal-head .x{width:34px; height:34px; border-radius:9px; background:var(--panel-2); display:flex; align-items:center; justify-content:center; color:var(--muted);}
  .modal-head .x:hover{color:var(--text);}
  .modal-body{padding:22px 24px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .field{margin-bottom:16px;}
  .seg{display:flex; background:var(--field); border:1px solid var(--line); border-radius:var(--radius-sm); padding:4px; margin-bottom:10px;}
  .seg button{flex:1; padding:8px; border-radius:7px; font-size:13px; color:var(--muted); display:flex; align-items:center; justify-content:center; gap:6px;}
  .seg button.active{background:var(--panel); color:var(--text); border:1px solid var(--line-2);}
  .url-row{display:flex; gap:8px;}
  .url-row .btn-add{width:44px; flex:none; border-radius:var(--radius-sm); background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center;}
  .url-row .btn-add:hover{background:#d8b88f;}
  .dropzone{border:1px dashed var(--line-2); border-radius:var(--radius-sm); padding:22px; text-align:center; color:var(--muted); font-size:13px; cursor:pointer;}
  .dropzone:hover{background:rgba(201,165,123,0.06);}
  .dropzone .icon{width:26px;height:26px;margin-bottom:8px;color:var(--accent);}
  .thumbs{display:flex; flex-wrap:wrap; gap:9px; margin-top:12px;}
  .thumb-sm{position:relative; width:62px; height:62px; border-radius:9px; overflow:hidden; border:1px solid var(--line-2); background:var(--panel-2);}
  .thumb-sm img{width:100%; height:100%; object-fit:cover;}
  .thumb-sm .rm{position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%; background:rgba(8,5,2,0.78); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; line-height:1;}
  .thumb-sm.cover::after{content:'Capa'; position:absolute; bottom:0; left:0; right:0; background:rgba(176,127,79,0.92); color:#fff; font-size:9px; text-align:center; padding:1px; letter-spacing:.05em;}
  .ficha-row{display:grid; grid-template-columns:1fr 1fr 1fr 1fr 36px; gap:8px; margin-bottom:8px; align-items:center;}
  .ficha-row .rm{border:1px solid var(--line-2); border-radius:var(--radius-sm); color:var(--danger); display:flex; align-items:center; justify-content:center;}
  .ficha-row .rm:hover{background:rgba(217,138,106,0.12);}
  .add-line{font-size:13px; color:var(--accent); display:inline-flex; align-items:center; gap:6px; padding:6px 0; margin-top:2px;}
  .add-line:hover{text-decoration:underline;}
  .toggle-line{display:flex; align-items:center; gap:10px; margin-top:6px; font-size:13.5px; color:var(--muted);}
  .toggle-line input{width:auto;}
  .modal-foot{display:flex; justify-content:flex-end; gap:12px; padding:16px 24px 22px; border-top:1px solid var(--line);}
  .hint{font-size:11.5px; color:var(--faint); margin-top:6px;}

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--panel); border:1px solid var(--line-2); color:var(--text); padding:12px 20px; border-radius:999px; font-size:13.5px; opacity:0; pointer-events:none; transition:all .3s; z-index:100; box-shadow:var(--shadow);}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .config-warn{max-width:560px; margin:60px auto; background:var(--panel); border:1px solid rgba(217,138,106,0.4); border-radius:var(--radius); padding:26px 28px; color:var(--text);}
  .config-warn h2{font-size:1.3rem; color:var(--danger); margin-bottom:10px;}
  .config-warn code{background:var(--field); padding:2px 6px; border-radius:5px; color:var(--accent); font-size:13px;}

  @media(max-width:560px){
    .row2{grid-template-columns:1fr;}
    .ficha-row{grid-template-columns:1fr 1fr; gap:6px;} .ficha-row .rm{grid-column:1 / -1; height:32px;}
  }
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login">
  <div class="login-card">
    <img src="https://customer-assets.emergentagent.com/job_a7ed97bc-4df4-497d-88dd-a008d07d9894/artifacts/k9u6kzi8_Logo.png" alt="Madeira Rústica" />
    <h1>Gestão de Projetos</h1>
    <p>Área reservada. Inicie sessão para gerir os projetos do site.</p>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="o-seu-email@exemplo.pt" autocomplete="username" />
    </div>
    <div class="field">
      <label for="pass">Palavra-passe</label>
      <input type="password" id="pass" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <button class="btn btn-primary" id="login-btn" style="width:100%;">Entrar</button>
    <div class="msg" id="login-msg"></div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app">
  <div class="topbar">
    <div class="brand">
      <img src="https://customer-assets.emergentagent.com/job_a7ed97bc-4df4-497d-88dd-a008d07d9894/artifacts/k9u6kzi8_Logo.png" alt="Madeira Rústica" />
      <div>
        <div class="t">Madeira Rústica</div>
        <div class="s">Gestão de projetos</div>
      </div>
    </div>
    <button class="btn btn-ghost" id="logout-btn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
      Sair
    </button>
  </div>

  <div class="head-row">
    <h2>Os teus projetos <span class="count" id="count"></span></h2>
    <button class="btn btn-primary" id="add-btn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      Adicionar projeto
    </button>
  </div>

  <div id="list"><div class="loading">A carregar projetos…</div></div>
</div>

<!-- ===================== MODAL ===================== -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modal-title">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7.4L12 17l-6.3 4.4L8 14 2 9.4h7.6z"/></svg>
        Novo projeto
      </h2>
      <button class="x" id="modal-x" aria-label="Fechar">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="modal-body">
      <div class="row2">
        <div class="field"><label>Título do projeto *</label><input type="text" id="f-titulo" placeholder="Ex: Armário de quarto por medida" /></div>
        <div class="field"><label>Categoria *</label>
          <select id="f-categoria">
            <option>Quarto</option><option>Sala</option><option>Cozinha</option><option>Arrumos</option>
            <option>Closet</option><option>Exterior</option><option>Jardim</option><option>Escritório</option><option>Entrada</option>
          </select>
        </div>
      </div>

      <div class="field"><label>🇬🇧 Título em inglês <span style="font-weight:400;opacity:.6;">(opcional — se vazio, o site usa o português)</span></label><input type="text" id="f-titulo-en" placeholder="Ex: Custom bedroom wardrobe" /></div>

      <div class="field"><label>Localização</label><input type="text" id="f-local" placeholder="Ex: Porto · 4,2m de frente" /></div>

      <div class="field">
        <label>Fotos do projeto (a 1ª é a capa) *</label>
        <div class="seg">
          <button type="button" class="active" id="seg-url" data-mode="url">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
            Endereço (URL)
          </button>
          <button type="button" id="seg-up" data-mode="upload">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5M12 3v12"/></svg>
            Carregar do PC
          </button>
        </div>

        <div id="pane-url" class="url-row">
          <input type="text" id="f-foto-url" placeholder="Cola o endereço da foto e carrega em +" />
          <button type="button" class="btn-add" id="foto-add" aria-label="Adicionar foto">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>

        <div id="pane-up" class="dropzone" style="display:none;">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5M12 3v12"/></svg>
          <div>Clica para escolher fotos do computador<br>(podes escolher várias de uma vez)</div>
          <input type="file" id="f-foto-file" accept="image/*" multiple style="display:none;" />
        </div>

        <div class="thumbs" id="thumbs"></div>
        <div class="hint" id="upload-hint"></div>
      </div>

      <div class="field"><label>Breve descrição *</label><textarea id="f-desc" placeholder="Descreve o projeto, as madeiras usadas, o que o torna único…"></textarea></div>

      <div class="field"><label>🇬🇧 Descrição em inglês <span style="font-weight:400;opacity:.6;">(opcional — se vazia, o site usa o português)</span></label><textarea id="f-desc-en" placeholder="Describe the project, the woods used, what makes it unique…"></textarea></div>

      <div class="field" style="margin-bottom:6px;">
        <label>Ficha técnica (opcional)</label>
        <div id="ficha-list"></div>
        <button type="button" class="add-line" id="ficha-add">
          <svg class="icon" style="width:15px;height:15px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Adicionar linha (ex: Material — Carvalho)
        </button>
      </div>

      <label class="toggle-line"><input type="checkbox" id="f-visivel" checked /> Mostrar este projeto no site</label>
    </div>

    <div class="modal-foot">
      <button class="btn btn-ghost" id="modal-cancel">Cancelar</button>
      <button class="btn btn-primary" id="modal-save">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
        Guardar projeto
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   CONFIGURAÇÃO — substitui pelos teus dados do Supabase
   (Project Settings → API)
   ============================================================ */
const SUPABASE_URL      = "https://jkztusnsfjdgawexynzg.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_HMZdPXkrO_E3nu_ksHRDmg_7q-tK0eV";

/* ============================================================ */

const $ = id => document.getElementById(id);
const toast = msg => { const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); };
const esc = s => String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let db = null, projetos = [], editId = null, fotos = [], configOk = true;

if (SUPABASE_URL.startsWith("COLOCA") || SUPABASE_ANON_KEY.startsWith("COLOCA")) {
  configOk = false;
  document.body.innerHTML =
    '<div class="config-warn"><h2>Falta a configuração</h2>'
    + '<p>Abre o ficheiro <code>admin.html</code> e, lá no fundo, substitui <code>SUPABASE_URL</code> e '
    + '<code>SUPABASE_ANON_KEY</code> pelos dados do teu projeto Supabase '
    + '(em <code>Project Settings → API</code>). Depois grava e atualiza esta página.</p></div>';
}

if (configOk) {
  db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  /* -------- AUTENTICAÇÃO -------- */
  async function checkSession(){
    const { data } = await db.auth.getSession();
    if (data.session) showApp(); else showLogin();
  }
  function showLogin(){ $('login').style.display='flex'; $('app').style.display='none'; }
  function showApp(){ $('login').style.display='none'; $('app').style.display='block'; loadProjetos(); }

  async function doLogin(){
    const email=$('email').value.trim(), pass=$('pass').value;
    const msg=$('login-msg'); msg.className='msg'; msg.textContent='A entrar…';
    const { error } = await db.auth.signInWithPassword({ email, password: pass });
    if (error){ msg.className='msg err'; msg.textContent='Email ou palavra-passe incorretos.'; }
    else { msg.textContent=''; $('pass').value=''; showApp(); }
  }
  $('login-btn').addEventListener('click', doLogin);
  $('pass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  $('email').addEventListener('keydown', e=>{ if(e.key==='Enter') $('pass').focus(); });
  $('logout-btn').addEventListener('click', async ()=>{ await db.auth.signOut(); showLogin(); });

  /* -------- CARREGAR / LISTAR -------- */
  async function loadProjetos(){
    $('list').innerHTML='<div class="loading">A carregar projetos…</div>';
    const { data, error } = await db.from('projetos').select('*').order('ordem',{ascending:true}).order('criado_em',{ascending:false});
    if (error){ $('list').innerHTML='<div class="empty">Erro ao carregar. Verifica a configuração e as regras (RLS) no Supabase.</div>'; return; }
    projetos = data||[];
    renderList();
  }

  function renderList(){
    $('count').textContent = projetos.length ? '· '+projetos.length : '';
    if (!projetos.length){
      $('list').innerHTML='<div class="empty"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15l5-5 4 4 3-3 6 6"/></svg><div>Ainda não há projetos.<br>Carrega em “Adicionar projeto” para criar o primeiro.</div></div>';
      return;
    }
    $('list').innerHTML='<div class="grid">'+projetos.map(p=>{
      const capa=(p.fotos&&p.fotos[0])||'';
      return `<div class="card">
        <div class="thumb">
          ${capa?`<img src="${esc(capa)}" alt="${esc(p.titulo)}" />`:'<div class="ph"><svg class="icon" style="width:30px;height:30px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg></div>'}
          <span class="tag">${esc(p.categoria)}</span>
          ${p.visivel?'':'<span class="hidden-flag"><svg class="icon" style="width:13px;height:13px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.9 4.2A9.1 9.1 0 0 1 12 4c7 0 10 8 10 8a13 13 0 0 1-1.7 2.7M6.6 6.6A13 13 0 0 0 2 12s3 8 10 8a9 9 0 0 0 5.4-1.6"/><path d="M1 1l22 22"/></svg>Oculto</span>'}
        </div>
        <div class="body">
          <h3>${esc(p.titulo)}</h3>
          <div class="loc">${esc(p.localizacao||'—')}</div>
          <div class="actions">
            <button class="edit" data-id="${p.id}"><svg class="icon" style="width:15px;height:15px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>Editar</button>
            <button class="del" data-id="${p.id}"><svg class="icon" style="width:15px;height:15px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>Apagar</button>
          </div>
        </div>
      </div>`;
    }).join('')+'</div>';

    document.querySelectorAll('.card .edit').forEach(b=>b.addEventListener('click',()=>openModal(b.dataset.id)));
    document.querySelectorAll('.card .del').forEach(b=>b.addEventListener('click',()=>removeProjeto(b.dataset.id)));
  }

  /* -------- MODAL -------- */
  function openModal(id){
    editId = id||null;
    const p = id ? projetos.find(x=>x.id===id) : null;
    $('modal-title').lastChild.textContent = p ? ' Editar projeto' : ' Novo projeto';
    $('f-titulo').value = p?p.titulo:'';
    $('f-titulo-en').value = p?(p.titulo_en||''):'';
    $('f-categoria').value = p?p.categoria:'Quarto';
    $('f-local').value = p?(p.localizacao||''):'';
    $('f-desc').value = p?(p.descricao||''):'';
    $('f-desc-en').value = p?(p.descricao_en||''):'';
    $('f-visivel').checked = p?!!p.visivel:true;
    fotos = p&&Array.isArray(p.fotos) ? [...p.fotos] : [];
    renderThumbs();
    renderFicha(p&&Array.isArray(p.ficha) ? p.ficha : [], p&&Array.isArray(p.ficha_en) ? p.ficha_en : []);
    $('f-foto-url').value=''; $('upload-hint').textContent='';
    setMode('url');
    $('overlay').classList.add('open');
  }
  function closeModal(){ $('overlay').classList.remove('open'); }
  $('add-btn').addEventListener('click',()=>openModal(null));
  $('modal-x').addEventListener('click',closeModal);
  $('modal-cancel').addEventListener('click',closeModal);
  $('overlay').addEventListener('click',e=>{ if(e.target===$('overlay')) closeModal(); });

  /* modo URL / Upload */
  function setMode(mode){
    const url = mode==='url';
    $('seg-url').classList.toggle('active',url);
    $('seg-up').classList.toggle('active',!url);
    $('pane-url').style.display = url?'flex':'none';
    $('pane-up').style.display = url?'none':'block';
  }
  $('seg-url').addEventListener('click',()=>setMode('url'));
  $('seg-up').addEventListener('click',()=>setMode('upload'));

  /* fotos por URL */
  function addFotoUrl(){
    const v=$('f-foto-url').value.trim();
    if(!v) return;
    fotos.push(v); $('f-foto-url').value=''; renderThumbs();
  }
  $('foto-add').addEventListener('click',addFotoUrl);
  $('f-foto-url').addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();addFotoUrl();} });

  /* fotos por upload */
  $('pane-up').addEventListener('click',()=>$('f-foto-file').click());
  $('f-foto-file').addEventListener('change', async e=>{
    const files=[...e.target.files]; if(!files.length) return;
    $('upload-hint').textContent='A carregar '+files.length+' foto(s)…';
    for(const file of files){
      const path = Date.now()+'_'+Math.random().toString(36).slice(2,7)+'_'+file.name.replace(/[^\w.\-]/g,'_');
      const { error } = await db.storage.from('projetos').upload(path,file,{cacheControl:'3600',upsert:false});
      if(error){ $('upload-hint').textContent='Erro ao carregar: '+error.message; continue; }
      const { data } = db.storage.from('projetos').getPublicUrl(path);
      fotos.push(data.publicUrl); renderThumbs();
    }
    $('upload-hint').textContent='Fotos carregadas ✓';
    e.target.value='';
  });

  function renderThumbs(){
    $('thumbs').innerHTML = fotos.map((u,i)=>`
      <div class="thumb-sm ${i===0?'cover':''}">
        <img src="${esc(u)}" alt="">
        <button type="button" class="rm" data-i="${i}" aria-label="Remover">✕</button>
      </div>`).join('');
    document.querySelectorAll('#thumbs .rm').forEach(b=>b.addEventListener('click',()=>{ fotos.splice(+b.dataset.i,1); renderThumbs(); }));
  }

  /* ficha técnica */
  function fichaRow(lbl,val,lblEn,valEn){
    const d=document.createElement('div'); d.className='ficha-row';
    d.innerHTML=`<input type="text" placeholder="Rótulo PT (ex: Material)" value="${esc(lbl)}">
      <input type="text" placeholder="Valor PT (ex: Carvalho)" value="${esc(val)}">
      <input type="text" placeholder="🇬🇧 Label EN (ex: Material)" value="${esc(lblEn||'')}">
      <input type="text" placeholder="🇬🇧 Value EN (ex: Oak)" value="${esc(valEn||'')}">
      <button type="button" class="rm" aria-label="Remover"><svg class="icon" style="width:15px;height:15px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>`;
    d.querySelector('.rm').addEventListener('click',()=>d.remove());
    return d;
  }
  function renderFicha(arr, arrEn){
    const l=$('ficha-list'); l.innerHTML='';
    const en = Array.isArray(arrEn) ? arrEn : [];
    (arr||[]).forEach((m,i)=>l.appendChild(fichaRow(m.lbl, m.val, (en[i]&&en[i].lbl)||'', (en[i]&&en[i].val)||'')));
  }
  $('ficha-add').addEventListener('click',()=>$('ficha-list').appendChild(fichaRow('','','','')));

  /* guardar */
  $('modal-save').addEventListener('click', async ()=>{
    const titulo=$('f-titulo').value.trim();
    const categoria=$('f-categoria').value;
    if(!titulo){ toast('Falta o título.'); return; }
    if(!fotos.length){ toast('Adiciona pelo menos uma foto.'); return; }
    if(!$('f-desc').value.trim()){ toast('Falta a descrição.'); return; }

    const fichaRows=[...document.querySelectorAll('#ficha-list .ficha-row')].map(r=>{
      const ins=r.querySelectorAll('input');
      return { lbl:ins[0].value.trim(), val:ins[1].value.trim(),
               lbl_en:ins[2].value.trim(), val_en:ins[3].value.trim() };
    });
    const ficha    = fichaRows.filter(m=>m.lbl||m.val).map(m=>({lbl:m.lbl, val:m.val}));
    const ficha_en = fichaRows.map(m=>({ lbl:(m.lbl_en||m.lbl), val:(m.val_en||m.val) }))
                              .filter((m,i)=> fichaRows[i].lbl_en || fichaRows[i].val_en );

    const payload={ titulo, categoria,
      titulo_en:$('f-titulo-en').value.trim() || null,
      localizacao:$('f-local').value.trim(),
      descricao:$('f-desc').value.trim(),
      descricao_en:$('f-desc-en').value.trim() || null,
      fotos, ficha, ficha_en, visivel:$('f-visivel').checked };

    $('modal-save').textContent='A guardar…';
    let error;
    if(editId){
      ({ error } = await db.from('projetos').update(payload).eq('id',editId));
    } else {
      const maxOrdem = projetos.reduce((m,p)=>Math.max(m,p.ordem||0),0);
      payload.ordem = maxOrdem+1;
      ({ error } = await db.from('projetos').insert(payload));
    }
    $('modal-save').innerHTML='<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg> Guardar projeto';
    if(error){ toast('Erro ao guardar: '+error.message); return; }
    closeModal(); toast(editId?'Projeto atualizado ✓':'Projeto criado ✓'); loadProjetos();
  });

  /* apagar */
  async function removeProjeto(id){
    const p=projetos.find(x=>x.id===id);
    if(!confirm('Apagar o projeto "'+(p?p.titulo:'')+'"? Esta ação não pode ser revertida.')) return;
    const { error } = await db.from('projetos').delete().eq('id',id);
    if(error){ toast('Erro ao apagar: '+error.message); return; }
    toast('Projeto apagado.'); loadProjetos();
  }

  checkSession();
}
</script>
</body>
</html>
