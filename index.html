<style>
  /* ---------- Login ---------- */
  #login-screen {
    position: fixed;
    inset: 0;
    background: #1B100A;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    transition: opacity .5s ease, visibility .5s ease;
  }
  #login-screen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .login-box {
    background: #2A1A0F;
    border: 1px solid rgba(201,165,123,0.18);
    border-radius: 20px;
    padding: 48px 40px 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    text-align: center;
  }
  .login-logo {
    height: 72px;
    width: 72px;
    object-fit: contain;
    border-radius: 50%;
    margin: 0 auto 20px;
    display: block;
  }
  .login-box h2 {
    font-family: 'Playfair Display', serif;
    color: #F3E9D7;
    font-size: 1.6rem;
    margin-bottom: 6px;
  }
  .login-box p {
    color: rgba(201,165,123,0.7);
    font-size: 0.88rem;
    margin-bottom: 32px;
  }
  .login-field {
    margin-bottom: 16px;
    text-align: left;
  }
  .login-field label {
    display: block;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: rgba(243,233,215,0.55);
    margin-bottom: 8px;
    font-weight: 500;
  }
  .login-field input {
    width: 100%;
    background: rgba(243,233,215,0.06);
    border: 1.5px solid rgba(243,233,215,0.12);
    color: #F3E9D7;
    padding: 13px 16px;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: border-color .3s ease;
  }
  .login-field input:focus {
    border-color: #C9A57B;
  }
  .login-btn {
    width: 100%;
    margin-top: 8px;
    padding: 14px;
    background: #C9A57B;
    color: #2A1A0F;
    border: none;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background .3s ease, transform .2s ease;
    letter-spacing: 0.03em;
  }
  .login-btn:hover {
    background: #8B5A2B;
    color: #F3E9D7;
    transform: translateY(-1px);
  }
  .login-error {
    margin-top: 14px;
    color: #E8A87C;
    font-size: 0.85rem;
    min-height: 20px;
  }

  /* ---------- Reset & base ---------- */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  :root {
    --c-bg:        #FAF6EE;
    --c-cream:     #F3E9D7;
    --c-light:     #E7D6BC;
    --c-wood:      #C9A57B;
    --c-brown:     #8B5A2B;
    --c-dark:      #5C3A1E;
    --c-deep:      #2A1A0F;
    --c-text:      #2A1A0F;
    --c-muted:     #6B5A48;
    --c-line:      rgba(42,26,15,0.12);
    --shadow-sm:   0 2px 8px rgba(42,26,15,0.06);
    --shadow-md:   0 12px 32px rgba(42,26,15,0.10);
    --shadow-lg:   0 24px 60px rgba(42,26,15,0.18);
    --radius:      14px;
    --container:   1200px;
    --ease:        cubic-bezier(.2,.7,.2,1);
  }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--c-bg);
    color: var(--c-text);
    line-height: 1.65;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  h1, h2, h3, h4 {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    line-height: 1.15;
    color: var(--c-deep);
    letter-spacing: -0.01em;
  }
  a { color: inherit; text-decoration: none; }
  img { max-width: 100%; display: block; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  ::selection { background: var(--c-brown); color: #fff; }
  .container {
    width: 100%;
    max-width: var(--container);
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 28px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.95rem;
    letter-spacing: 0.01em;
    transition: all .35s var(--ease);
    border: 1.5px solid transparent;
    will-change: transform;
  }
  .btn-primary { background: var(--c-deep); color: var(--c-cream); box-shadow: var(--shadow-md); }
  .btn-primary:hover { background: var(--c-brown); transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .btn-primary:active { transform: translateY(0); }
  .btn-ghost { border-color: var(--c-deep); color: var(--c-deep); }
  .btn-ghost:hover { background: var(--c-deep); color: var(--c-cream); transform: translateY(-2px); }
  .btn .arrow { transition: transform .35s var(--ease); }
  .btn:hover .arrow { transform: translateX(4px); }

  /* ---------- Header ---------- */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(250,246,238,0.85);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid transparent;
    transition: all .35s var(--ease);
  }
  header.scrolled { background: rgba(250,246,238,0.95); border-bottom-color: var(--c-line); box-shadow: var(--shadow-sm); }
  .nav { display: flex; align-items: center; justify-content: space-between; height: 80px; }
  .brand { display: flex; align-items: center; gap: 12px; font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.25rem; color: var(--c-deep); }
  .brand img { height: 56px; width: 56px; object-fit: cover; border-radius: 50%; }
  .brand-text { display: flex; flex-direction: column; justify-content: center; line-height: 1.1; }
  .brand-name { letter-spacing: 0.02em; }
  .brand-slogan { 
    font-family: 'Inter', sans-serif; 
    font-weight: 600; 
    font-size: 1.05rem; 
    letter-spacing: 0.04em; 
    color: var(--c-muted); 
    margin-top: 2px; 
  }
  .brand-slogan .sl-accent { color: var(--c-brown); }
  .brand-em { font-style: italic; }
  .nav-links { display: flex; gap: 36px; list-style: none; align-items: center; }
  .nav-links a { font-size: 0.92rem; font-weight: 500; color: var(--c-text); position: relative; padding: 6px 0; transition: color .25s var(--ease); }
  .nav-links a::after { content: ''; position: absolute; left: 0; bottom: 0; width: 0; height: 1.5px; background: var(--c-brown); transition: width .35s var(--ease); }
  .nav-links a:hover { color: var(--c-brown); }
  .nav-links a:hover::after { width: 100%; }
  .lang-toggle {
    position: relative; display: inline-flex; align-items: center;
    background: var(--c-cream); border: 1px solid var(--c-line);
    border-radius: 999px; padding: 3px; cursor: pointer;
    font-family: inherit; line-height: 1;
  }
  .lang-toggle .lang-opt {
    position: relative; z-index: 1;
    padding: 5px 13px; border-radius: 999px;
    font-size: 0.78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: var(--c-muted); transition: color .3s var(--ease);
  }
  .lang-toggle .lang-opt.active { color: var(--c-cream); }
  .lang-toggle .lang-pill {
    position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px);
    background: var(--c-deep); border-radius: 999px;
    transition: transform .3s var(--ease);
  }
  .lang-toggle[data-lang="en"] .lang-pill { transform: translateX(100%); }
  .hamburger { display: none; width: 44px; height: 44px; align-items: center; justify-content: center; border-radius: 50%; transition: background .25s var(--ease); }
  .hamburger:hover { background: var(--c-cream); }
  .hamburger span { display: block; width: 22px; height: 2px; background: var(--c-deep); position: relative; transition: all .35s var(--ease); }
  .hamburger span::before, .hamburger span::after { content: ''; position: absolute; left: 0; width: 22px; height: 2px; background: var(--c-deep); transition: all .35s var(--ease); }
  .hamburger span::before { top: -7px; }
  .hamburger span::after  { top: 7px; }
  .hamburger.open span { background: transparent; }
  .hamburger.open span::before { top: 0; transform: rotate(45deg); }
  .hamburger.open span::after  { top: 0; transform: rotate(-45deg); }

  /* ---------- Hero ---------- */
  .hero {
    position: relative; padding: 160px 0 100px; overflow: hidden;
    background: radial-gradient(ellipse at 80% 20%, rgba(201,165,123,0.35), transparent 55%),
                radial-gradient(ellipse at 10% 80%, rgba(139,90,43,0.18), transparent 50%), var(--c-bg);
  }
  .hero::before {
    content: ''; position: absolute; inset: 0;
    background-image: repeating-linear-gradient(90deg, rgba(92,58,30,.03) 0 1px, transparent 1px 80px),
                      repeating-linear-gradient(0deg, rgba(92,58,30,.03) 0 1px, transparent 1px 80px);
    pointer-events: none;
  }
  .hero-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 60px; align-items: center; position: relative; z-index: 2; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 8px 16px; background: rgba(139,90,43,0.08); border: 1px solid rgba(139,90,43,0.18);
    border-radius: 999px; font-size: 0.78rem; font-weight: 500; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--c-brown); margin-bottom: 24px;
  }
  .eyebrow .dot { width: 6px; height: 6px; background: var(--c-brown); border-radius: 50%; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.6);opacity:.55} }
  .hero h1 { font-size: clamp(2.5rem, 5.5vw, 4.5rem); margin-bottom: 24px; }
  .hero h1 .accent { font-style: italic; font-weight: 500; color: var(--c-brown); position: relative; display: inline-block; }
  .hero h1 .accent::after { content: ''; position: absolute; left: 0; right: 0; bottom: 4px; height: 8px; background: rgba(201,165,123,0.45); z-index: -1; transform: skewX(-8deg); }
  .hero p.lead { font-size: 1.15rem; color: var(--c-muted); max-width: 540px; margin-bottom: 36px; }
  .hero-actions { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 56px; }
  .hero-stats { display: flex; gap: 48px; flex-wrap: wrap; }
  .stat .num { font-family: 'Playfair Display', serif; font-size: 1.45rem; font-weight: 600; color: var(--c-deep); line-height: 1.1; font-style: italic; }
  .stat .lbl { font-size: 0.78rem; color: var(--c-muted); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.08em; }
  .hero-art {
    position: relative; aspect-ratio: 4/5; border-radius: 220px 220px 24px 24px;
    background: linear-gradient(160deg, var(--c-light) 0%, var(--c-wood) 60%, var(--c-brown) 100%);
    box-shadow: var(--shadow-lg); overflow: hidden; animation: float 8s ease-in-out infinite;
  }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
  .hero-art::before {
    content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(92deg, rgba(92,58,30,0.08) 0 2px, transparent 2px 14px, rgba(92,58,30,0.05) 14px 16px, transparent 16px 32px),
                repeating-linear-gradient(88deg, rgba(42,26,15,0.06) 0 1px, transparent 1px 28px);
    mix-blend-mode: multiply;
  }
  .hero-art::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 30%, rgba(255,255,255,0.25), transparent 55%); }
  .hero-badge { position: absolute; bottom: 18px; left: 18px; right: 18px; background: rgba(250,246,238,0.96); backdrop-filter: blur(8px); padding: 11px 14px; border-radius: 11px; display: flex; align-items: center; gap: 11px; box-shadow: var(--shadow-md); z-index: 2; }
  .hero-badge .icn { width: 34px; height: 34px; background: var(--c-deep); color: var(--c-cream); border-radius: 9px; display: grid; place-items: center; flex-shrink: 0; }
  .hero-badge .icn svg { width: 17px; height: 17px; }
  .hero-badge h4 { font-family: 'Inter', sans-serif; font-size: 0.8rem; font-weight: 600; color: var(--c-deep); margin-bottom: 1px; }
  .hero-badge p { font-size: 0.72rem; color: var(--c-muted); line-height: 1.35; }
  .hero-floating { position: absolute; background: rgba(250,246,238,0.96); backdrop-filter: blur(8px); padding: 14px 18px; border-radius: 12px; box-shadow: var(--shadow-md); font-size: 0.85rem; font-weight: 500; color: var(--c-deep); display: flex; align-items: center; gap: 10px; z-index: 3; }
  .hero-floating.f1 { top: 8%; left: -28px; animation: float 6s ease-in-out infinite; }
  .hero-floating.f2 { top: 45%; right: -32px; animation: float 7s ease-in-out infinite reverse; }
  .hero-floating .badge-dot { width: 8px; height: 8px; background: #4a8c3f; border-radius: 50%; box-shadow: 0 0 0 4px rgba(74,140,63,0.18); }

  /* ---------- Section base ---------- */
  section { padding: 110px 0; position: relative; }
  .section-head { max-width: 720px; margin: 0 auto 64px; text-align: center; }
  .section-head .eyebrow { margin-bottom: 18px; }
  .section-head h2 { font-size: clamp(2.1rem, 4vw, 3.25rem); margin-bottom: 16px; }
  .section-head p { color: var(--c-muted); font-size: 1.05rem; }

  /* ---------- Sobre ---------- */
  .about { background: var(--c-cream); position: relative; overflow: hidden; }
  .about::before { content: ''; position: absolute; width: 360px; height: 360px; background: rgba(139,90,43,0.06); border-radius: 50%; top: -160px; right: -120px; }
  .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; }
  .about-text h2 { font-size: clamp(2rem, 3.6vw, 3rem); margin-bottom: 22px; }
  .about-text p { color: var(--c-muted); font-size: 1.05rem; margin-bottom: 18px; }
  .values { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; margin-top: 36px; }
  .value { background: var(--c-bg); border-radius: 12px; padding: 20px 18px; border: 1px solid var(--c-line); transition: transform .35s var(--ease), box-shadow .35s var(--ease); }
  .value:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
  .value .v-icn { width: 40px; height: 40px; border-radius: 10px; background: var(--c-deep); color: var(--c-cream); display: grid; place-items: center; margin-bottom: 12px; }
  .value h4 { font-family: 'Inter', sans-serif; font-size: 0.95rem; color: var(--c-deep); margin-bottom: 4px; }
  .value p { font-size: 0.82rem; color: var(--c-muted); line-height: 1.5; }
  .about-art { position: relative; aspect-ratio: 1/1.05; border-radius: 24px; background: linear-gradient(135deg, var(--c-wood), var(--c-brown)); box-shadow: var(--shadow-lg); overflow: hidden; }
  .about-art::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(110deg, rgba(42,26,15,0.10) 0 2px, transparent 2px 18px), repeating-linear-gradient(20deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 24px); }
  .about-quote { position: absolute; bottom: 24px; left: 24px; right: 24px; background: rgba(250,246,238,0.97); padding: 24px; border-radius: 14px; box-shadow: var(--shadow-md); }
  .about-quote p { font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.05rem; color: var(--c-deep); line-height: 1.5; margin-bottom: 8px; }
  .about-quote span { font-size: 0.78rem; color: var(--c-muted); text-transform: uppercase; letter-spacing: 0.1em; }

  /* ---------- Serviços ---------- */
  .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; }
  .service-card { background: #fff; border-radius: var(--radius); padding: 36px 28px; border: 1px solid var(--c-line); transition: all .45s var(--ease); position: relative; overflow: hidden; cursor: pointer; }
  .service-card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, var(--c-cream), var(--c-bg)); opacity: 0; transition: opacity .45s var(--ease); z-index: 0; }
  .service-card > * { position: relative; z-index: 1; }
  .service-card:hover { transform: translateY(-8px); box-shadow: var(--shadow-lg); border-color: rgba(139,90,43,0.35); }
  .service-card:hover::before { opacity: 1; }
  .service-card .s-icn { width: 56px; height: 56px; border-radius: 14px; background: var(--c-deep); color: var(--c-cream); display: grid; place-items: center; margin-bottom: 22px; transition: transform .45s var(--ease), background .35s var(--ease); }
  .service-card:hover .s-icn { background: var(--c-brown); transform: rotate(-6deg) scale(1.05); }
  .service-card h3 { font-size: 1.3rem; margin-bottom: 10px; }
  .service-card p { color: var(--c-muted); font-size: 0.95rem; margin-bottom: 18px; }
  .service-card .more { font-size: 0.85rem; font-weight: 600; color: var(--c-brown); display: inline-flex; align-items: center; gap: 6px; transition: gap .35s var(--ease); cursor: pointer; background: none; border: none; font-family: inherit; padding: 0; }
  .service-card:hover .more { gap: 12px; }
  .service-card .more:hover { color: var(--c-deep); }

  .modal-icon { width: 64px; height: 64px; border-radius: 16px; background: var(--c-deep); color: var(--c-cream); display: grid; place-items: center; margin-bottom: 22px; }
  .modal h3 { font-size: 1.85rem; margin-bottom: 14px; }
  .modal .modal-lead { color: var(--c-muted); font-size: 1rem; margin-bottom: 24px; line-height: 1.6; }
  .modal h4 { font-family: 'Inter', sans-serif; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--c-brown); margin-bottom: 14px; font-weight: 600; }
  .modal ul { list-style: none; display: grid; gap: 10px; margin-bottom: 28px; }
  .modal ul li { display: flex; align-items: flex-start; gap: 12px; font-size: 0.95rem; color: var(--c-text); }
  .modal ul li::before { content: ''; flex-shrink: 0; width: 18px; height: 18px; margin-top: 3px; border-radius: 50%; background: var(--c-cream); background-image: linear-gradient(45deg, transparent 38%, var(--c-brown
