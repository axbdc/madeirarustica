<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Madeira Rústica — Acesso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: #1B100A;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .box {
    background: #2A1A0F;
    border: 1px solid rgba(201,165,123,0.18);
    border-radius: 20px;
    padding: 48px 40px 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    text-align: center;
  }
  .logo {
    height: 72px; width: 72px;
    object-fit: contain;
    border-radius: 50%;
    margin: 0 auto 20px;
    display: block;
  }
  h2 {
    font-family: 'Playfair Display', serif;
    color: #F3E9D7;
    font-size: 1.6rem;
    margin-bottom: 6px;
  }
  .sub {
    color: rgba(201,165,123,0.7);
    font-size: 0.88rem;
    margin-bottom: 32px;
  }
  .field { margin-bottom: 16px; text-align: left; }
  .field label {
    display: block;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: rgba(243,233,215,0.55);
    margin-bottom: 8px;
    font-weight: 500;
  }
  .field input {
    width: 100%;
    background: rgba(243,233,215,0.06);
    border: 1.5px solid rgba(243,233,215,0.12);
    color: #F3E9D7;
    padding: 13px 16px;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: border-color .3s;
  }
  .field input:focus { border-color: #C9A57B; }
  .btn {
    width: 100%;
    margin-top: 8px;
    padding: 14px;
    background: #C9A57B;
    color: #2A1A0F;
    border: none;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background .3s, transform .2s;
    letter-spacing: 0.03em;
  }
  .btn:hover { background: #8B5A2B; color: #F3E9D7; transform: translateY(-1px); }
  .error {
    margin-top: 14px;
    color: #E8A87C;
    font-size: 0.85rem;
    min-height: 20px;
  }
  @media (max-width: 480px) { .box { padding: 36px 24px 28px; } }
</style>
</head>
<body>
<div class="box">
  <img class="logo" src="/logo.jpg" alt="Madeira Rústica" />
  <h2>Madeira Rústica</h2>
  <p class="sub">Acesso reservado. Introduza as suas credenciais.</p>
  <div class="field">
    <label for="u">Utilizador</label>
    <input type="text" id="u" placeholder="utilizador" autocomplete="username" />
  </div>
  <div class="field">
    <label for="p">Password</label>
    <input type="password" id="p" placeholder="••••••••" autocomplete="current-password" />
  </div>
  <button class="btn" id="btn">Entrar</button>
  <div class="error" id="err"></div>
</div>
<script>
  const COOKIE_NAME  = 'mr_auth';
  const COOKIE_VALUE = 'madeira2026secure';

  const login = () => {
    const u = document.getElementById('u').value.trim();
    const p = document.getElementById('p').value;
    if (u === 'admin' && p === 'admin123') {
      // Define cookie de sessão (expira quando o browser fecha)
      document.cookie = `${COOKIE_NAME}=${COOKIE_VALUE}; path=/; SameSite=Strict`;
      window.location.href = '/';
    } else {
      document.getElementById('err').textContent = 'Utilizador ou password incorretos.';
      document.getElementById('p').value = '';
      document.getElementById('p').focus();
    }
  };

  document.getElementById('btn').addEventListener('click', login);
  ['u','p'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });
  });
</script>
</body>
</html>
